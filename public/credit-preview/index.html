<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECN2 片尾預覽</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;500&family=DM+Serif+Display:ital@0;1&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0a0a; --text:#e8e4dc; --text-muted:#888;
  --accent:#c8a97e; --panel-bg:#141414; --panel-border:#2a2a2a;
  --font-zh:'Noto Serif TC',serif; --font-en:'DM Serif Display',serif;
  --font-mono:'Space Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;display:flex;height:100vh;overflow:hidden;}

/* Loading */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:200;}
#loading .spinner{width:36px;height:36px;border:2px solid var(--panel-border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#loading p{font-size:13px;color:var(--text-muted);}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:#1a1a1a;border:1px solid var(--panel-border);color:var(--text);padding:10px 20px;border-radius:20px;font-size:12px;z-index:300;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
#toast.error{border-color:#e24b4a;color:#e24b4a;}

/* Project Modal */
#project-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:150;display:none;align-items:center;justify-content:center;}
#project-modal.open{display:flex;}
.modal-box{background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:12px;padding:28px;width:500px;max-width:90vw;}
.modal-box h2{font-family:var(--font-en);font-weight:400;font-size:20px;margin-bottom:6px;}
.modal-box p{font-size:12px;color:var(--text-muted);margin-bottom:20px;line-height:1.6;}
.project-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-height:220px;overflow-y:auto;}
.project-item{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#1a1a1a;border:1px solid var(--panel-border);border-radius:6px;cursor:pointer;transition:all .15s;}
.project-item:hover,.project-item.active{border-color:var(--accent);}
.project-item.active{background:#1f1a12;}
.proj-name{flex:1;font-size:13px;}
.proj-url{font-size:10px;color:var(--text-muted);font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px;}
.proj-del{color:var(--text-muted);font-size:14px;padding:2px 6px;border:none;background:transparent;cursor:pointer;border-radius:3px;}
.proj-del:hover{color:#e24b4a;}
.modal-add{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--panel-border);padding-top:16px;}
.modal-add input{padding:8px 10px;background:#1a1a1a;border:1px solid var(--panel-border);color:var(--text);border-radius:4px;font-size:12px;font-family:'Noto Sans TC',sans-serif;}
.modal-add input::placeholder{color:var(--text-muted);}
.modal-btns{display:flex;gap:8px;margin-top:4px;}
.modal-btn{flex:1;padding:9px;border:1px solid var(--panel-border);background:transparent;color:var(--text);font-size:12px;font-family:'Noto Sans TC',sans-serif;border-radius:6px;cursor:pointer;transition:all .15s;}
.modal-btn:hover{border-color:var(--accent);color:var(--accent);}
.modal-btn.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:500;}

/* Panel */
#panel{width:280px;min-width:280px;background:var(--panel-bg);border-right:1px solid var(--panel-border);display:flex;flex-direction:column;overflow-y:auto;}
#panel-header{padding:16px 18px;border-bottom:1px solid var(--panel-border);}
.logo-label{font-family:var(--font-mono);font-size:10px;color:var(--accent);letter-spacing:2px;margin-bottom:4px;}
#panel-header h1{font-family:var(--font-en);font-size:17px;font-weight:400;}
#current-project{font-size:11px;color:var(--accent);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.section{padding:12px 18px;border-bottom:1px solid var(--panel-border);}
.section-title{font-size:10px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px;}

.mode-toggle{display:flex;background:#1a1a1a;border-radius:6px;padding:3px;gap:3px;}
.mode-btn{flex:1;padding:6px 8px;border:none;background:transparent;color:var(--text-muted);font-size:12px;font-family:'Noto Sans TC',sans-serif;border-radius:4px;cursor:pointer;transition:all .15s;}
.mode-btn.active{background:var(--accent);color:#000;font-weight:500;}
.mode-btn:not(.active):hover{background:rgba(255,255,255,.06);color:var(--text);}
.mode-btn:active{transform:scale(.97);}

.ctrl-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.ctrl-label{font-size:12px;color:var(--text-muted);}
.ctrl-value{font-family:var(--font-mono);font-size:11px;color:var(--accent);}
input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0 8px;}
.color-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.color-row label{font-size:12px;color:var(--text-muted);flex:1;}
input[type=color]{width:36px;height:28px;padding:2px;cursor:pointer;flex:none;background:#1a1a1a;border:1px solid var(--panel-border);border-radius:4px;}

.action-btn{width:100%;padding:9px 12px;border:1px solid var(--panel-border);background:transparent;color:var(--text);font-size:12px;font-family:'Noto Sans TC',sans-serif;border-radius:6px;cursor:pointer;transition:all .15s;margin-bottom:6px;text-align:left;display:flex;align-items:center;gap:8px;}
.action-btn:hover{border-color:var(--accent);color:var(--accent);}
.action-btn:active{background:rgba(200,169,126,.15);transform:scale(.98);}
.action-btn.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:500;}
.action-btn.primary:active{opacity:.7;}
.action-btn.playing{background:#1a1a1a;color:var(--accent);border-color:var(--accent);}

/* Preview */
#preview-area{flex:1;display:flex;flex-direction:column;min-width:0;}
#preview-toolbar{height:44px;background:var(--panel-bg);border-bottom:1px solid var(--panel-border);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;}
.toolbar-label{font-size:11px;color:var(--text-muted);letter-spacing:1px;}
#tb-project{font-size:11px;color:var(--accent);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tb-btn{padding:4px 12px;background:transparent;border:1px solid var(--panel-border);color:var(--text-muted);border-radius:4px;font-size:11px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s;}
.tb-btn:hover{border-color:var(--accent);color:var(--accent);}
.tb-btn:active{background:rgba(200,169,126,.15);}
.play-btn{padding:5px 14px;background:var(--accent);color:#000;border:none;border-radius:4px;font-size:12px;font-weight:500;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s;}
.play-btn:active{opacity:.7;transform:scale(.97);}
.play-btn.playing{background:#1a1a1a;color:var(--accent);border:1px solid var(--accent);}

#preview-wrapper{flex:1;overflow:hidden;background:#050505;display:flex;align-items:center;justify-content:center;padding:24px;}
#preview-wrapper.strip-mode{align-items:flex-start;overflow-y:auto;padding:0;}

#preview-frame{position:relative;overflow:hidden;box-shadow:0 0 0 1px #333,0 24px 80px rgba(0,0,0,.8);flex-shrink:0;transition:width .3s,height .3s;}
#preview-wrapper.strip-mode #preview-frame{box-shadow:none;overflow:visible;width:100%!important;height:auto!important;}

#credit-viewport{width:100%;height:100%;overflow:hidden;position:relative;}
#preview-wrapper.strip-mode #credit-viewport{overflow:visible;height:auto;}

#credit-scroll-container{position:absolute;width:100%;padding:0 10%;}
#preview-wrapper.strip-mode #credit-scroll-container{position:relative;padding:40px 10% 80px;}
@keyframes creditRoll{from{transform:translateY(0)}to{transform:translateY(var(--roll-end))}}

/* Credit 內容 */
.credit-group{width:100%;margin-bottom:2em;text-align:center;position:relative;border-radius:4px;padding:8px 4px;}
.credit-group:hover{outline:1px dashed rgba(200,169,126,.25);}
.credit-group-title-zh{letter-spacing:.15em;margin-bottom:.15em;}
.credit-group-title-en{letter-spacing:.2em;opacity:.4;margin-bottom:.8em;border-bottom:1px solid rgba(255,255,255,.07);padding-bottom:.5em;}

/* Inline edit */
.editable{cursor:text;border-radius:2px;transition:background .15s;padding:1px 3px;margin:-1px -3px;display:inline-block;}
.editable:hover{background:rgba(200,169,126,.12);}
.editable:focus{outline:1px solid var(--accent);background:rgba(200,169,126,.08);}

/* Entry row */
.entry-row{display:flex;align-items:center;justify-content:center;gap:.3em;margin-bottom:.4em;position:relative;}
.entry-row:hover .entry-actions{opacity:1;}
.entry-actions{position:absolute;right:-60px;top:50%;transform:translateY(-50%);display:flex;gap:4px;opacity:0;transition:opacity .15s;}
.entry-actions button{width:22px;height:22px;border:1px solid var(--panel-border);background:var(--panel-bg);color:var(--text-muted);border-radius:3px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.entry-actions button:hover{border-color:var(--accent);color:var(--accent);}
.entry-actions .del-btn:hover{border-color:#e24b4a;color:#e24b4a;}

.entry-stack .row-zh{display:flex;justify-content:center;gap:2em;}
.entry-stack .row-en{display:flex;justify-content:center;gap:2em;opacity:.4;}
.entry-stack .role{text-align:right;}
.entry-stack .name{text-align:left;}
.entry-split{display:flex;justify-content:center;margin-bottom:.3em;}
.entry-split .col-zh{text-align:right;padding-right:1.5em;border-right:1px solid rgba(255,255,255,.1);}
.entry-split .col-en{text-align:left;padding-left:1.5em;opacity:.5;}
.entry-split .role{opacity:.6;font-size:.85em;}

/* 新增按鈕 */
.add-entry-btn{display:inline-flex;align-items:center;gap:4px;margin-top:.5em;padding:4px 10px;border:1px dashed rgba(200,169,126,.3);background:transparent;color:rgba(200,169,126,.5);font-size:11px;font-family:'Noto Sans TC',sans-serif;border-radius:4px;cursor:pointer;transition:all .2s;}
.add-entry-btn:hover{border-color:var(--accent);color:var(--accent);}

/* 贊助商 */
.sponsor-section{width:100%;margin-bottom:2.5em;text-align:center;}
.sponsor-tier-zh{letter-spacing:.2em;margin-bottom:.15em;}
.sponsor-tier-en{letter-spacing:.15em;opacity:.4;margin-bottom:1em;font-size:.75em;}
.sponsor-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;}
.sponsor-box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:4px;display:flex;align-items:center;justify-content:center;padding:0 14px;font-size:.75em;color:rgba(255,255,255,.6);}
.sponsor-box img{max-width:100%;max-height:100%;object-fit:contain;}
.credit-end{text-align:center;padding:4em 0 6em;opacity:.2;font-family:var(--font-mono);font-size:.7em;letter-spacing:.2em;}

/* Sync indicator */
#sync-indicator{position:fixed;top:12px;right:12px;font-size:11px;color:var(--text-muted);font-family:var(--font-mono);z-index:100;display:none;}
#sync-indicator.syncing{display:block;color:var(--accent);}
#sync-indicator.done{display:block;color:#639922;}
#sync-indicator.err{display:block;color:#e24b4a;}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>載入資料中...</p></div>
<div id="toast"></div>
<div id="sync-indicator">⟳ 同步中...</div>

<!-- Project Modal -->
<div id="project-modal">
  <div class="modal-box">
    <h2>專案管理</h2>
    <p>每部片對應一份 Google Sheets。切換專案會重新載入資料。</p>
    <div class="project-list" id="project-list"></div>
    <div class="modal-add">
      <input type="text" id="new-proj-name" placeholder="專案名稱（例如：2024 某某電影）">
      <input type="text" id="new-proj-url" placeholder="Proxy 網址（預設：https://www.ecn2studio.com/api/credits）">
      <div class="modal-btns">
        <button class="modal-btn" onclick="closeProjectModal()">取消</button>
        <button class="modal-btn primary" onclick="addProject()">✚ 新增專案</button>
      </div>
    </div>
  </div>
</div>

<!-- Panel -->
<div id="panel">
  <div id="panel-header">
    <div class="logo-label">ECN2 STUDIO</div>
    <h1>片尾預覽系統</h1>
    <div id="current-project">未選擇專案</div>
  </div>

  <div class="section">
    <div class="section-title">專案</div>
    <button class="action-btn" onclick="openProjectModal()">📁 切換 / 管理專案</button>
    <button class="action-btn" onclick="reloadData()">🔄 重新載入資料</button>
  </div>

  <div class="section">
    <div class="section-title">顯示模式</div>
    <div class="mode-toggle">
      <button class="mode-btn active" id="btn-strip" onclick="setDisplayMode('strip')">長條捲動</button>
      <button class="mode-btn" id="btn-frame" onclick="setDisplayMode('frame')">畫框模式</button>
    </div>
  </div>

  <div class="section" id="aspect-section" style="display:none">
    <div class="section-title">畫幅比例</div>
    <div class="mode-toggle">
      <button class="mode-btn active" onclick="setAspect(2.39,this)">2.39</button>
      <button class="mode-btn" onclick="setAspect(2.0,this)">2:1</button>
      <button class="mode-btn" onclick="setAspect(1.85,this)">1.85</button>
      <button class="mode-btn" onclick="setAspect(16/9,this)">16:9</button>
      <button class="mode-btn" onclick="setAspect(4/3,this)">4:3</button>
    </div>
  </div>

  <div class="section" id="playback-section" style="display:none">
    <div class="section-title">自動捲動</div>
    <div class="ctrl-row"><span class="ctrl-label">速度</span><span class="ctrl-value" id="val-spd">普通</span></div>
    <input type="range" id="range-spd" min="1" max="5" value="3" oninput="updateSpeed()">
    <button class="action-btn primary" id="play-btn-panel" onclick="togglePlay()">▶ 播放</button>
  </div>

  <div class="section">
    <div class="section-title">全局排版</div>
    <div class="mode-toggle" style="margin-bottom:10px">
      <button class="mode-btn active" id="btn-stack" onclick="setGlobalLayout('stack')">中上英下</button>
      <button class="mode-btn" id="btn-split" onclick="setGlobalLayout('split')">左中右英</button>
    </div>
    <div class="ctrl-row"><span class="ctrl-label">中文字體</span><span class="ctrl-value" id="val-fs-zh">18px</span></div>
    <input type="range" id="range-fs-zh" min="10" max="32" value="18" oninput="applyGlobalFont()">
    <div class="ctrl-row"><span class="ctrl-label">英文字體</span><span class="ctrl-value" id="val-fs-en">13px</span></div>
    <input type="range" id="range-fs-en" min="8" max="24" value="13" oninput="applyGlobalFont()">
  </div>

  <div class="section">
    <div class="section-title">風格</div>
    <div class="color-row"><label>背景色</label><input type="color" id="color-bg" value="#000000" oninput="applyColors()"></div>
    <div class="color-row"><label>文字色</label><input type="color" id="color-text" value="#ffffff" oninput="applyColors()"></div>
    <div class="color-row"><label>強調色</label><input type="color" id="color-accent" value="#c8a97e" oninput="applyColors()"></div>
  </div>

  <div class="section">
    <div class="section-title">操作</div>
    <button class="action-btn" onclick="copyJSON()">⬇ 複製 JSON</button>
  </div>
</div>

<!-- Preview -->
<div id="preview-area">
  <div id="preview-toolbar">
    <span class="toolbar-label">PREVIEW</span>
    <span id="tb-project">—</span>
    <span class="toolbar-label" id="tb-mode" style="color:var(--accent)">STRIP</span>
    <button class="tb-btn" onclick="reloadData()" style="margin-left:auto">🔄</button>
    <button class="play-btn" id="play-btn-toolbar" onclick="togglePlay()" style="display:none">▶ 播放</button>
  </div>
  <div id="preview-wrapper" class="strip-mode">
    <div id="preview-frame">
      <div id="credit-viewport">
        <div id="credit-scroll-container"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════
// 狀態
// ══════════════════════════════════
const PROJ_KEY    = 'ecn2_projects';
const CUR_KEY     = 'ecn2_current';
const DEFAULT_URL = 'https://www.ecn2studio.com/api/credits';

let RAW          = null;
let displayMode  = 'strip';
let globalLayout = 'stack';
let aspect       = 2.39;
let isPlaying    = false;

const SPEED_DUR   = [0,120,90,60,40,25];
const SPEED_LABEL = ['','很慢','慢','普通','快','很快'];

// ══════════════════════════════════
// Toast / Sync indicator
// ══════════════════════════════════
function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isError ? ' error' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = ''; }, 2500);
}

let syncTimer;
function showSync(state, msg) {
  const el = document.getElementById('sync-indicator');
  el.textContent = msg || (state === 'syncing' ? '⟳ 同步中...' : state === 'done' ? '✓ 已同步' : '✕ 同步失敗');
  el.className = state;
  clearTimeout(syncTimer);
  if (state !== 'syncing') syncTimer = setTimeout(() => { el.className = ''; }, 2000);
}

// ══════════════════════════════════
// 專案管理
// ══════════════════════════════════
function getProjects() {
  try { return JSON.parse(localStorage.getItem(PROJ_KEY)) || []; } catch { return []; }
}
function saveProjects(list) { localStorage.setItem(PROJ_KEY, JSON.stringify(list)); }
function getCurrentProject() {
  const list = getProjects();
  const name = localStorage.getItem(CUR_KEY);
  return list.find(p => p.name === name) || list[0] || null;
}

function openProjectModal() { renderProjectList(); document.getElementById('project-modal').classList.add('open'); }
function closeProjectModal() { document.getElementById('project-modal').classList.remove('open'); }

function renderProjectList() {
  const list = getProjects();
  const cur  = getCurrentProject();
  const el   = document.getElementById('project-list');
  if (!list.length) {
    el.innerHTML = '<div style="font-size:12px;color:var(--text-muted);padding:8px 0">尚無專案，請在下方新增。</div>';
    return;
  }
  el.innerHTML = list.map(p => `
    <div class="project-item ${cur&&cur.name===p.name?'active':''}" onclick="selectProject('${p.name}')">
      <div style="flex:1"><div class="proj-name">${p.name}</div><div class="proj-url">${p.url}</div></div>
      <button class="proj-del" onclick="event.stopPropagation();deleteProject('${p.name}')">✕</button>
    </div>`).join('');
}

function selectProject(name) {
  localStorage.setItem(CUR_KEY, name);
  renderProjectList();
  closeProjectModal();
  reloadData();
}

function addProject() {
  const name = document.getElementById('new-proj-name').value.trim();
  const url  = document.getElementById('new-proj-url').value.trim() || DEFAULT_URL;
  if (!name) { showToast('請填入專案名稱', true); return; }
  const list = getProjects();
  if (list.find(p => p.name === name)) { showToast('專案名稱已存在', true); return; }
  list.push({ name, url });
  saveProjects(list);
  localStorage.setItem(CUR_KEY, name);
  document.getElementById('new-proj-name').value = '';
  document.getElementById('new-proj-url').value  = '';
  renderProjectList();
  closeProjectModal();
  reloadData();
}

function deleteProject(name) {
  if (!confirm(`確定刪除「${name}」？`)) return;
  let list = getProjects().filter(p => p.name !== name);
  saveProjects(list);
  if (localStorage.getItem(CUR_KEY) === name) localStorage.setItem(CUR_KEY, list[0]?.name || '');
  renderProjectList();
}

// ══════════════════════════════════
// 資料載入
// ══════════════════════════════════
window.addEventListener('load', () => {
  if (!getProjects().length) {
    saveProjects([{ name: '預設專案', url: DEFAULT_URL }]);
    localStorage.setItem(CUR_KEY, '預設專案');
  }
  reloadData();
});

function reloadData() {
  const proj = getCurrentProject();
  if (!proj) { openProjectModal(); return; }
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('current-project').textContent = proj.name;
  document.getElementById('tb-project').textContent = proj.name;

  fetch(proj.url)
    .then(r => { if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(data => { RAW = data; document.getElementById('loading').style.display = 'none'; initUI(); })
    .catch(err => {
      document.getElementById('loading').style.display = 'none';
      showToast('載入失敗：' + err.message, true);
    });
}

// ══════════════════════════════════
// 寫回 Sheets
// ══════════════════════════════════
function postToSheets(body) {
  const proj = getCurrentProject();
  if (!proj) return Promise.reject('no project');
  showSync('syncing');
  return fetch(proj.url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  })
  .then(r => r.json())
  .then(d => {
    if (d.ok) showSync('done');
    else { showSync('err', '✕ ' + (d.error||'失敗')); throw new Error(d.error); }
    return d;
  })
  .catch(err => { showSync('err'); throw err; });
}

// ══════════════════════════════════
// UI 初始化
// ══════════════════════════════════
function initUI() {
  const c = RAW.config || {};
  globalLayout = c.layout || 'stack';
  document.getElementById('color-bg').value    = c.bgColor     || '#000000';
  document.getElementById('color-text').value  = c.textColor   || '#ffffff';
  document.getElementById('color-accent').value= c.accentColor || '#c8a97e';
  const fsZh = c.fontSize   || 18;
  const fsEn = c.fontSizeEn || 13;
  document.getElementById('range-fs-zh').value = fsZh;
  document.getElementById('val-fs-zh').textContent = fsZh + 'px';
  document.getElementById('range-fs-en').value = fsEn;
  document.getElementById('val-fs-en').textContent = fsEn + 'px';
  applyColors();
  setGlobalLayout(globalLayout, true);
  rebuild();
}

function applyColors() {
  const f = document.getElementById('preview-frame');
  f.style.background = document.getElementById('color-bg').value;
  f.style.color      = document.getElementById('color-text').value;
  f.style.setProperty('--credit-accent', document.getElementById('color-accent').value);
}

function applyGlobalFont() {
  const zh = document.getElementById('range-fs-zh').value;
  const en = document.getElementById('range-fs-en').value;
  document.getElementById('val-fs-zh').textContent = zh + 'px';
  document.getElementById('val-fs-en').textContent = en + 'px';
  rebuild();
}

function setGlobalLayout(l, init) {
  globalLayout = l;
  document.getElementById('btn-stack').classList.toggle('active', l==='stack');
  document.getElementById('btn-split').classList.toggle('active', l==='split');
  if (!init) rebuild();
}

function updateSpeed() {
  document.getElementById('val-spd').textContent = SPEED_LABEL[document.getElementById('range-spd').value];
}

// ══════════════════════════════════
// 顯示模式
// ══════════════════════════════════
function setDisplayMode(m, init) {
  displayMode = m;
  document.getElementById('btn-strip').classList.toggle('active', m==='strip');
  document.getElementById('btn-frame').classList.toggle('active', m==='frame');
  document.getElementById('aspect-section').style.display   = m==='frame' ? 'block' : 'none';
  document.getElementById('playback-section').style.display = m==='frame' ? 'block' : 'none';
  document.getElementById('tb-mode').textContent = m==='strip' ? 'STRIP' : 'FRAME';
  document.getElementById('play-btn-toolbar').style.display = m==='frame' ? '' : 'none';

  const wrapper = document.getElementById('preview-wrapper');
  const frame   = document.getElementById('preview-frame');
  if (m === 'strip') {
    wrapper.classList.add('strip-mode');
    frame.style.boxShadow = 'none';
    stopPlay();
  } else {
    wrapper.classList.remove('strip-mode');
    frame.style.boxShadow = '0 0 0 1px #333,0 24px 80px rgba(0,0,0,.8)';
    resizeFrame();
  }
  if (!init) rebuild();
}

function setAspect(ratio, btn) {
  aspect = ratio;
  if (btn) {
    btn.closest('.mode-toggle').querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  }
  resizeFrame();
}

function resizeFrame() {
  if (displayMode==='strip') return;
  const wrap = document.getElementById('preview-wrapper');
  const mw = wrap.clientWidth-48, mh = wrap.clientHeight-48;
  let w=mw, h=w/aspect;
  if (h>mh){h=mh;w=h*aspect;}
  const f = document.getElementById('preview-frame');
  f.style.width  = Math.floor(w)+'px';
  f.style.height = Math.floor(h)+'px';
}
window.addEventListener('resize', ()=>{ if(displayMode==='frame') resizeFrame(); });

// ══════════════════════════════════
// 建構 Credit 內容
// ══════════════════════════════════
function rebuild() {
  if (!RAW) return;
  const sc   = document.getElementById('credit-scroll-container');
  const fsZh = parseFloat(document.getElementById('range-fs-zh').value);
  const fsEn = parseFloat(document.getElementById('range-fs-en').value);
  let html   = '';

  (RAW.credits||[]).forEach((group, gi) => {
    html += `<div class="credit-group" data-gi="${gi}" style="padding:8px 4px">
      <div class="credit-group-title-zh" style="font-size:${fsZh*0.7}px;color:var(--credit-accent,#c8a97e);letter-spacing:.2em">${esc(group.groupZh||'')}</div>
      <div class="credit-group-title-en" style="font-size:${fsZh*0.55}px">${esc(group.groupEn||'')}</div>`;

    const sorted = (group.entries||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));
    sorted.forEach((e, ei) => {
      if (globalLayout === 'stack') {
        html += `<div class="entry-stack" style="font-size:${fsZh}px;margin-bottom:.5em;position:relative">
          <div class="row-zh" style="display:flex;justify-content:center;gap:2em">
            <span class="role" style="min-width:6em;text-align:right">
              <span class="editable" contenteditable="true"
                data-gi="${gi}" data-ei="${ei}" data-field="roleZh"
                onblur="handleEdit(this)"
                onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}"
              >${esc(e.roleZh||'')}</span>
            </span>
            <span class="name" style="min-width:6em;text-align:left">
              <span class="editable" contenteditable="true"
                data-gi="${gi}" data-ei="${ei}" data-field="nameZh"
                onblur="handleEdit(this)"
                onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}"
              >${esc(e.nameZh||'')}</span>
            </span>
          </div>
          ${(e.roleEn||e.nameEn)?`<div class="row-en" style="display:flex;justify-content:center;gap:2em;opacity:.4;font-size:${fsEn}px">
            <span class="role" style="min-width:6em;text-align:right">
              <span class="editable" contenteditable="true"
                data-gi="${gi}" data-ei="${ei}" data-field="roleEn"
                onblur="handleEdit(this)"
                onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}"
              >${esc(e.roleEn||'')}</span>
            </span>
            <span class="name" style="min-width:6em;text-align:left">
              <span class="editable" contenteditable="true"
                data-gi="${gi}" data-ei="${ei}" data-field="nameEn"
                onblur="handleEdit(this)"
                onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}"
              >${esc(e.nameEn||'')}</span>
            </span>
          </div>`:''}
          <div class="entry-actions">
            <button title="刪除" class="del-btn" onclick="deleteEntry(${gi},${ei})">✕</button>
          </div>
        </div>`;
      } else {
        html += `<div class="entry-split" style="font-size:${fsZh}px;margin-bottom:.4em;position:relative">
          <div class="col-zh" style="text-align:right;padding-right:1.5em;border-right:1px solid rgba(255,255,255,.1)">
            <div class="role" style="font-size:${fsEn}px;opacity:.6">
              <span class="editable" contenteditable="true"
                data-gi="${gi}" data-ei="${ei}" data-field="roleZh"
                onblur="handleEdit(this)"
                onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}"
              >${esc(e.roleZh||'')}</span>
            </div>
            <div class="name">
              <span class="editable" contenteditable="true"
                data-gi="${gi}" data-ei="${ei}" data-field="nameZh"
                onblur="handleEdit(this)"
                onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}"
              >${esc(e.nameZh||'')}</span>
            </div>
          </div>
          <div class="col-en" style="text-align:left;padding-left:1.5em;opacity:.5">
            <div class="role" style="font-size:${fsEn}px;opacity:.6">
              <span class="editable" contenteditable="true"
                data-gi="${gi}" data-ei="${ei}" data-field="roleEn"
                onblur="handleEdit(this)"
                onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}"
              >${esc(e.roleEn||'')}</span>
            </div>
            <div class="name">
              <span class="editable" contenteditable="true"
                data-gi="${gi}" data-ei="${ei}" data-field="nameEn"
                onblur="handleEdit(this)"
                onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}"
              >${esc(e.nameEn||'')}</span>
            </div>
          </div>
          <div class="entry-actions">
            <button title="刪除" class="del-btn" onclick="deleteEntry(${gi},${ei})">✕</button>
          </div>
        </div>`;
      }
    });

    html += `<button class="add-entry-btn" onclick="addEntry(${gi})">＋ 新增人員</button>`;
    html += `</div>`;
  });

  // 贊助商
  const tierSizes = [{w:140,h:54},{w:110,h:44},{w:86,h:36},{w:110,h:34}];
  (RAW.sponsors||[]).forEach((tier, ti) => {
    const sz = tierSizes[ti]||{w:100,h:40};
    const scale = fsZh/18;
    const sw=Math.round(sz.w*scale), sh=Math.round(sz.h*scale);
    html += `<div class="sponsor-section">
      <div class="sponsor-tier-zh" style="font-size:${fsZh*0.65}px;color:var(--credit-accent,#c8a97e);letter-spacing:.2em">${esc(tier.tierZh||'')}</div>
      <div class="sponsor-tier-en" style="font-size:${fsZh*0.5}px">${esc(tier.tierEn||'')}</div>
      <div class="sponsor-grid">`;
    (tier.items||[]).forEach(item=>{
      html += (item.logoUrl&&item.logoUrl.startsWith('http'))
        ? `<div class="sponsor-box" style="width:${sw}px;height:${sh}px"><img src="${item.logoUrl}" alt="${esc(item.nameZh||'')}"></div>`
        : `<div class="sponsor-box" style="width:${sw}px;height:${sh}px">${esc(item.nameZh||'')}</div>`;
    });
    html += `</div></div>`;
  });

  html += `<div class="credit-end">© ${new Date().getFullYear()} 伊西恩兔映像有限公司</div>`;

  if (displayMode === 'frame') {
    sc.style.position = 'absolute';
    const fh = document.getElementById('preview-frame').clientHeight || 400;
    sc.innerHTML = `<div style="height:${fh}px"></div>${html}<div style="height:${fh}px"></div>`;
  } else {
    sc.style.position = 'relative';
    sc.innerHTML = html;
  }
  sc.style.animation = 'none';
  sc.style.transform = '';
  isPlaying = false;
  updatePlayBtn(false);
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ══════════════════════════════════
// Inline Edit
// ══════════════════════════════════
function handleEdit(el) {
  const gi    = parseInt(el.dataset.gi);
  const ei    = parseInt(el.dataset.ei);
  const field = el.dataset.field;
  const value = el.textContent.trim();

  const group = (RAW.credits||[])[gi];
  if (!group) return;
  const sorted = group.entries.slice().sort((a,b)=>(a.order||0)-(b.order||0));
  const entry = sorted[ei];
  if (!entry) return;

  // 只有值真的改變才同步
  if (entry[field] === value) return;

  // 先更新本地
  entry[field] = value;

  // 同步到 Sheets
  postToSheets({
    action:     'updateEntry',
    groupZh:    group.groupZh,
    entryIndex: ei,
    field,
    value,
  }).catch(() => showToast('同步失敗，請重新載入', true));
}

// ══════════════════════════════════
// 新增人員
// ══════════════════════════════════
function addEntry(gi) {
  const group = (RAW.credits||[])[gi];
  if (!group) return;

  const newEntry = { roleZh:'職稱', roleEn:'Role', nameZh:'姓名', nameEn:'Name', order: (group.entries||[]).length + 1 };
  if (!group.entries) group.entries = [];
  group.entries.push(newEntry);
  rebuild();

  postToSheets({
    action:  'addEntry',
    groupZh: group.groupZh,
    entry:   newEntry,
  }).catch(() => showToast('新增失敗，請重新載入', true));
}

// ══════════════════════════════════
// 刪除人員
// ══════════════════════════════════
function deleteEntry(gi, ei) {
  const group = (RAW.credits||[])[gi];
  if (!group) return;
  const sorted = group.entries.slice().sort((a,b)=>(a.order||0)-(b.order||0));
  const entry  = sorted[ei];
  if (!entry) return;

  if (!confirm(`確定刪除「${entry.nameZh}」？`)) return;

  // 從本地移除
  const idx = group.entries.indexOf(entry);
  if (idx !== -1) group.entries.splice(idx, 1);
  rebuild();

  postToSheets({
    action:     'deleteEntry',
    groupZh:    group.groupZh,
    entryIndex: ei,
  }).catch(() => showToast('刪除失敗，請重新載入', true));
}

// ══════════════════════════════════
// 播放
// ══════════════════════════════════
function togglePlay() { isPlaying ? stopPlay() : startPlay(); }

function startPlay() {
  if (displayMode==='strip') return;
  const sc  = document.getElementById('credit-scroll-container');
  const fh  = document.getElementById('preview-frame').clientHeight;
  const spd = SPEED_DUR[document.getElementById('range-spd').value];
  sc.style.setProperty('--roll-end', `-${sc.scrollHeight-fh}px`);
  sc.style.animation = `creditRoll ${spd}s linear forwards`;
  isPlaying = true;
  updatePlayBtn(true);
  sc.addEventListener('animationend', ()=>{ isPlaying=false; updatePlayBtn(false); }, {once:true});
}

function stopPlay() {
  const sc = document.getElementById('credit-scroll-container');
  sc.style.animation = 'none';
  sc.style.transform = '';
  isPlaying = false;
  updatePlayBtn(false);
}

function updatePlayBtn(playing) {
  const label = playing ? '⏹ 停止' : '▶ 播放';
  ['play-btn-toolbar','play-btn-panel'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = label;
    el.classList.toggle('playing', playing);
  });
}

// ══════════════════════════════════
// 複製 JSON
// ══════════════════════════════════
function copyJSON() {
  if (!RAW) return;
  const out = {
    config: { ...(RAW.config||{}),
      bgColor:    document.getElementById('color-bg').value,
      textColor:  document.getElementById('color-text').value,
      accentColor:document.getElementById('color-accent').value,
      fontSize:   document.getElementById('range-fs-zh').value,
      fontSizeEn: document.getElementById('range-fs-en').value,
      layout:     globalLayout,
    },
    credits:  RAW.credits,
    sponsors: RAW.sponsors,
  };
  navigator.clipboard.writeText(JSON.stringify(out, null, 2))
    .then(()=>showToast('✅ JSON 已複製'));
}

setTimeout(()=>{ if(displayMode==='frame') resizeFrame(); }, 100);
</script>
